name: Bug report
description: Something does not work or does not look right after applying the dotfiles
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before reporting, run `chezmoi diff` to check that your files match the repo.
        Antes de reportar, ejecuta `chezmoi diff` para comprobar que tus ficheros coinciden con el repo.
  - type: dropdown
    id: part
    attributes:
      label: What fails?
      options:
        - Hyprland (windows, keybindings, monitors)
        - Waybar
        - Login screen (SDDM)
        - Logout menu (wlogout)
        - App launcher (wofi)
        - Terminal (kitty) or shell
        - Theme (GTK, Qt, fonts, notifications)
        - Neovim
        - Installing or applying with chezmoi
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `hyprctl version | head -1` and `chezmoi --version`.
      placeholder: Hyprland 0.57.0, chezmoi v2.73.3
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `chezmoi git -- rev-parse --short HEAD`.
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
      description: Steps to reproduce, error messages, screenshots if it is about the look.
    validations:
      required: true
