# Inactividad: bloquear a los 5 min, apagar pantallas a los 10, suspender a los 30

general {
    lock_cmd = pidof hyprlock || hyprlock                              # una sola instancia
    before_sleep_cmd = loginctl lock-session                           # bloquear antes de suspender
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # encender pantallas al volver
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
