; Identidad Hyprland de kats76 (paleta de hyprland.conf / waybar)
; https://github.com/uiriansan/SilentSDDM/wiki/Customizing

[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "hypr-wallpaper.jpg"
use-background-color = false
background-color = "#000000"
blur = 48
brightness = -0.25
saturation = 0.0
input-keystroke = false
ignore-shift-key = false

[LockScreen.Clock]
display = true
position = "top-center"
align = "center"
format = "HH:mm"
font-family = "JetBrainsMono Nerd Font"
font-size = 96
font-weight = 800
color = "#cdd6f4"

[LockScreen.Date]
display = true
format = "dddd, d 'de' MMMM"
locale = "es_ES"
font-family = "JetBrainsMono Nerd Font"
font-size = 14
font-weight = 600
color = "#6f9f98"
margin-top = -5

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
text = "Pulsa cualquier tecla"
font-family = "JetBrainsMono Nerd Font"
font-size = 12
font-weight = 400
display-icon = true
icon = "enter.svg"
icon-size = 16
color = "#a08f95"
paint-icon = true
spacing = 0

[LoginScreen]
background = "hypr-wallpaper.jpg"
use-background-color = false
background-color = "#000000"
blur = 24
brightness = -0.35
saturation = -0.1

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 120
inactive-size = 80
inactive-opacity = 0.35
active-border-size = 3
inactive-border-size = 2
active-border-color = "#8a63c7"
inactive-border-color = "#6f9f98"
always-active = false

[LoginScreen.LoginArea.Username]
font-family = "JetBrainsMono Nerd Font"
font-size = 16
font-weight = 700
color = "#cdd6f4"
margin = 10

[LoginScreen.LoginArea.PasswordInput]
width = 260
height = 36
display-icon = true
font-family = "JetBrainsMono Nerd Font"
font-size = 12
icon = "password.svg"
icon-size = 16
content-color = "#cdd6f4"
background-color = "#1e1e2e"
background-opacity = 0.75
border-size = 2
border-color = "#8a63c7"
border-radius-left = 10
border-radius-right = 10
margin-top = 10
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#8a63c7"
background-opacity = 0.85
active-background-color = "#6f9f98"
active-background-opacity = 1.0
icon = "arrow-right.svg"
icon-size = 18
content-color = "#c7ced6"
active-content-color = "#1e1e2e"
border-size = 0
border-color = "#cdd6f4"
border-radius-left = 10
border-radius-right = 10
margin-left = 5
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "JetBrainsMono Nerd Font"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Entrando..."
font-family = "JetBrainsMono Nerd Font"
font-weight = 600
font-size = 14
icon-size = 30
icon = "spinner.svg"
color = "#8a63c7"
spacing = 5

[LoginScreen.LoginArea.WarningMessage]
font-family = "JetBrainsMono Nerd Font"
font-size = 11
font-weight = 400
normal-color = "#cdd6f4"
warning-color = "#6f9f98"
error-color = "#c44532"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 50
margin-right = 50
margin-bottom = 50
margin-left = 50
size = 30
border-radius = 5
spacing = 10
font-family = "JetBrainsMono Nerd Font"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 30
item-spacing = 2
padding = 5
display-scrollbar = true
margin = 5
background-color = "#1e1e2e"
background-opacity = 0.85
active-option-background-color = "#8a63c7"
active-option-background-opacity = 0.6
content-color = "#cdd6f4"
active-content-color = "#cdd6f4"
font-family = "JetBrainsMono Nerd Font"
border-size = 1
border-color = "#8a63c7"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 200
popup-width = 200
background-color = "#8a63c7"
background-opacity = 0.0
active-background-opacity = 0.5
content-color = "#cdd6f4"
active-content-color = "#cdd6f4"
border-size = 0
font-size = 10
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = true
background-color = "#8a63c7"
background-opacity = 0.0
active-background-opacity = 0.5
content-color = "#cdd6f4"
active-content-color = "#cdd6f4"
border-size = 0
font-size = 10
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-right"
index = 0
background-color = "#8a63c7"
background-opacity = 0.0
active-background-opacity = 0.5
content-color = "#cdd6f4"
active-content-color = "#cdd6f4"
border-size = 0
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 100
background-color = "#8a63c7"
background-opacity = 0.0
active-background-opacity = 0.5
content-color = "#cdd6f4"
active-content-color = "#cdd6f4"
border-size = 0
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#1e1e2e"
background-opacity = 0.85
key-content-color = "#cdd6f4"
key-color = "#8a63c7"
key-opacity = 0.25
key-active-background-color = "#8a63c7"
key-active-opacity = 0.7
selection-background-color = "#8a63c7"
selection-content-color = "#cdd6f4"
primary-color = "#8a63c7"
border-size = 0
border-color = "#8a63c7"
restrict-input = "none"

[Tooltips]
enable = true
font-family = "JetBrainsMono Nerd Font"
font-size = 11
content-color = "#cdd6f4"
background-color = "#1e1e2e"
background-opacity = 0.85
border-radius = 5
disable-user = false
disable-login-button = false
