# Se instala en /etc/sddm.conf.d/ (OJO: /etc/sddm.conf tiene prioridad sobre este dir)
[General]
InputMethod=qtvirtualkeyboard
GreeterEnvironment=QML2_IMPORT_PATH=/usr/share/sddm/themes/silent/components/,QT_IM_MODULE=qtvirtualkeyboard

[Theme]
Current=silent

[X11]
# Login en una sola pantalla (ver Xsetup)
DisplayCommand=/usr/local/share/sddm/Xsetup
